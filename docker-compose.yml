# docker compose up -d
# Requires: .env file at repo root

name: bytherix

services:

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:8.0
    container_name: bytherix_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE:      ${MONGO_INITDB_DATABASE}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - bytherix_internal
    # Never expose Mongo port to host in production
    # Expose only for local dev via override file
    healthcheck:
      test: ["CMD", "mongosh",
             "--quiet",
             "--username", "${MONGO_INITDB_ROOT_USERNAME}",
             "--password", "${MONGO_INITDB_ROOT_PASSWORD}",
             "--authenticationDatabase", "admin",
             "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    read_only: false   # Mongo needs to write
    tmpfs:
      - /tmp

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:8.8-alpine
    container_name: bytherix_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
      --protected-mode yes
      --bind 0.0.0.0
    volumes:
      - redis_data:/data
    networks:
      - bytherix_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 64M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # ── API (Express) ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
      network: host
      args:
        NODE_VERSION: "22.23-alpine3.23"
    image: bytherix/api:latest
    container_name: bytherix_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV:     production
      PORT:         ${API_PORT:-5000}
      MONGODB_URI:  ${MONGODB_URI}
      REDIS_URL:    ${REDIS_URL}
      UPLOAD_DIR:   /app/uploads
    ports:
      - "${API_PORT:-5000}:5000"
    networks:
      - bytherix_internal
      - bytherix_external
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # ── Web (Next.js) ─────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      network: host
      args:
        NODE_VERSION: "22.23-alpine3.23"
    image: bytherix/web:latest
    container_name: bytherix_web
    restart: unless-stopped
    environment:
      NODE_ENV:              production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL:  ${NEXT_PUBLIC_API_URL:-http://api:5000/api/v1}
    ports:
      - "3000:3000"
    networks:
      - bytherix_internal
      - bytherix_external
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 120s
      retries: 5
      start_period: 300s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  bytherix_internal:
    # Mongo and Redis are only on internal — not reachable from outside
    driver: bridge
    internal: true
  bytherix_external:
    # API and Web are on both — can reach internal services AND be reached from host
    driver: bridge

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
